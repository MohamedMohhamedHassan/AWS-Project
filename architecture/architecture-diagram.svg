<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526579"/></marker>
<style>.title{font:700 30px Arial;fill:#172b4d}.sub{font:16px Arial;fill:#526579}.box{fill:#fff;stroke:#52718f;stroke-width:2;rx:14}.aws{fill:#fff8ed;stroke:#d78a22;stroke-width:2;rx:14}.data{fill:#eef8ff;stroke:#3984b9;stroke-width:2;rx:14}.notify{fill:#f5efff;stroke:#8563bd;stroke-width:2;rx:14}.label{font:700 18px Arial;fill:#172b4d;text-anchor:middle}.small{font:14px Arial;fill:#40556b;text-anchor:middle}.arrow{stroke:#526579;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}</style></defs>
<rect width="1400" height="920" fill="#f6f9fc"/>
<text x="700" y="58" class="title" text-anchor="middle">Serverless Image Processing Pipeline</text>
<text x="700" y="88" class="sub" text-anchor="middle">AWS 2 Graduation Project · Proposed reference architecture</text>
<rect x="45" y="170" width="170" height="95" class="box"/><text x="130" y="207" class="label">User / Client</text><text x="130" y="233" class="small">Web or mobile app</text>
<rect x="275" y="170" width="190" height="95" class="aws"/><text x="370" y="207" class="label">API Gateway</text><text x="370" y="233" class="small">Request upload URL</text>
<rect x="535" y="170" width="190" height="95" class="aws"/><text x="630" y="207" class="label">Lambda</text><text x="630" y="233" class="small">Validate · create URL</text>
<rect x="795" y="170" width="230" height="95" class="data"/><text x="910" y="207" class="label">S3 Source Bucket</text><text x="910" y="233" class="small">Private original images</text>
<path d="M215 217 H275" class="arrow"/><path d="M465 217 H535" class="arrow"/><path d="M725 217 H795" class="arrow"/><text x="772" y="150" class="small">Pre-signed HTTPS upload</text>
<rect x="795" y="365" width="230" height="100" class="aws"/><text x="910" y="404" class="label">SQS Work Queue</text><text x="910" y="430" class="small">Buffers ObjectCreated events</text>
<rect x="1090" y="365" width="250" height="100" class="notify"/><text x="1215" y="404" class="label">SQS Dead-Letter Queue</text><text x="1215" y="430" class="small">Repeated failures · redrive</text>
<path d="M910 265 V365" class="arrow"/><text x="1028" y="316" class="small">S3 event notification</text><path d="M1025 415 H1090" class="arrow dashed"/><text x="1057" y="394" class="small">After retry limit</text>
<rect x="505" y="365" width="220" height="100" class="aws"/><text x="615" y="404" class="label">Lambda Dispatcher</text><text x="615" y="430" class="small">Poll SQS · idempotency</text><path d="M795 415 H725" class="arrow"/>
<rect x="245" y="365" width="200" height="100" class="aws"/><text x="345" y="404" class="label">Step Functions</text><text x="345" y="430" class="small">Orchestrates workflow</text><path d="M505 415 H445" class="arrow"/>
<rect x="245" y="565" width="200" height="100" class="aws"/><text x="345" y="604" class="label">Lambda Processor</text><text x="345" y="630" class="small">Validate · resize · watermark</text><path d="M345 465 V565" class="arrow"/>
<rect x="535" y="565" width="210" height="100" class="data"/><text x="640" y="604" class="label">S3 Destination</text><text x="640" y="630" class="small">Processed image variants</text><path d="M445 615 H535" class="arrow"/>
<rect x="835" y="565" width="210" height="100" class="data"/><text x="940" y="604" class="label">DynamoDB</text><text x="940" y="630" class="small">Status · metadata · output keys</text><path d="M745 615 H835" class="arrow"/>
<rect x="1130" y="565" width="210" height="100" class="notify"/><text x="1235" y="604" class="label">Amazon SNS</text><text x="1235" y="630" class="small">Success / failure notice</text><path d="M1045 615 H1130" class="arrow"/>
<rect x="535" y="755" width="210" height="95" class="aws"/><text x="640" y="794" class="label">CloudFront</text><text x="640" y="820" class="small">HTTPS · OAC · edge cache</text><path d="M640 665 V755" class="arrow"/><path d="M535 802 H130 V265" class="arrow dashed"/><text x="285" y="785" class="small">Processed content delivery to client</text>
<rect x="835" y="755" width="210" height="95" class="box"/><text x="940" y="794" class="label">CloudWatch</text><text x="940" y="820" class="small">Logs · metrics · alarms</text><path d="M940 665 V755" class="arrow dashed"/>
<text x="700" y="890" class="sub" text-anchor="middle">Private S3 buckets · least-privilege IAM · encryption at rest and in transit</text>
</svg>